      parameters:
        - in: query
          name: format
          schema:
            type: string
            enum: [excel, csv]
            default: excel
        - in: query
          name: ids
          description: Danh sách UUID cách nhau dấu phẩy (export cụ thể)
          schema:
            type: string
            example: uuid1,uuid2,uuid3
        - $ref: '#/components/parameters/SearchParam'
        - in: query
          name: asset_type
          schema:
            type: array
            items:
              $ref: '#/components/schemas/AssetType'
          style: form
          explode: true
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/AssetStatus'
        - $ref: '#/components/parameters/ProvinceParam'
        - $ref: '#/components/parameters/DistrictParam'
        - in: query
          name: application_date_from
          schema:
            type: string
            format: date
        - in: query
          name: application_date_to
          schema:
            type: string
            format: date
        - in: query
          name: grant_date_from
          schema:
            type: string
            format: date
        - in: query
          name: grant_date_to
          schema:
            type: string
            format: date
      responses:
        '200':
          description: File Excel hoặc CSV
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
            text/csv:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'

  /export/public:
    get:
      tags: [Import/Export]
      summary: Export đối tượng SHTT (Public – giới hạn 100 bản ghi)
      operationId: exportAssetsPublic
      description: Rate limit cực thấp (5 req/phút/IP). Chỉ xuất các cột public, không có `internal_notes`.
      parameters:
        - in: query
          name: format
          schema:
            type: string
            enum: [excel, csv]
            default: excel
        - in: query
          name: ids
          schema:
            type: string
        - $ref: '#/components/parameters/SearchParam'
        - in: query
          name: asset_type
          schema:
            type: array
            items:
              $ref: '#/components/schemas/AssetType'
          style: form
          explode: true
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/AssetStatus'
      responses:
        '200':
          description: File Excel hoặc CSV
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
            text/csv:
              schema:
                type: string
                format: binary
        '429':
          $ref: '#/components/responses/429TooManyRequests'

  # ============================================================================
  # DASHBOARD (Staff+)
  # ============================================================================
  /dashboard/stats:
    get:
      tags: [Dashboard]
      summary: Thống kê tổng quan hệ thống (Staff+)
      operationId: getDashboardStats
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Dữ liệu thống kê tổng quan
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      total:
                        type: integer
                        description: Tổng số đối tượng SHTT
                        example: 1250
                      by_type:
                        type: object
                        description: Số lượng theo loại
                        additionalProperties:
                          type: integer
                        example:
                          trademark: 450
                          patent: 320
                          copyright: 280
                          design: 120
                          gi: 55
                          craft: 25
                      by_status:
                        type: object
                        description: Số lượng theo trạng thái
                        additionalProperties:
                          type: integer
                      expiring_soon:
                        type: integer
                        description: Số đối tượng hết hạn trong 90 ngày tới
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'

  /dashboard/expiring:
    get:
      tags: [Dashboard]
      summary: Danh sách đối tượng SHTT sắp hết hạn (Staff+)
      operationId: getDashboardExpiring
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: days
          description: Số ngày tới (mặc định 90, tối đa 365)
          schema:
            type: integer
            default: 90
            maximum: 365
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Danh sách sắp hết hạn
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/IpAsset'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'

  /dashboard/top-applicants:
    get:
      tags: [Dashboard]
      summary: Top chủ đơn nộp nhiều nhất (Staff+)
      operationId: getDashboardTopApplicants
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: limit
          description: Số lượng trả về (mặc định 10, tối đa 50)
          schema:
            type: integer
            default: 10
            maximum: 50
        - in: query
          name: asset_type
          schema:
            $ref: '#/components/schemas/AssetType'
      responses:
        '200':
          description: Danh sách top chủ đơn
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        applicant_name:
                          type: string
                        count:
                          type: integer
                        org_id:
                          type: string
                          format: uuid
                          nullable: true
                        person_id:
                          type: string
                          format: uuid
                          nullable: true
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'

  /dashboard/top-groups:
    get:
      tags: [Dashboard]
      summary: Thống kê SHTT theo địa phương (Staff+)
      operationId: getDashboardTopGroups
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: limit
          description: Số lượng trả về (mặc định 10)
          schema:
            type: integer
            default: 10
            maximum: 50
      responses:
        '200':
          description: Thống kê theo địa phương
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        district_code:
                          type: string
                        district_name:
                          type: string
                        count:
                          type: integer
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'

  /dashboard/timeline:
    get:
      tags: [Dashboard]
      summary: Biểu đồ nộp/cấp đơn theo thời gian (Staff+)
      operationId: getDashboardTimeline
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: year
          description: Năm thống kê (mặc định năm hiện tại)
          schema:
            type: integer
            example: 2025
        - in: query
          name: groupBy
          schema:
            type: string
            enum: [month, quarter]
            default: month
        - in: query
          name: asset_type
          schema:
            $ref: '#/components/schemas/AssetType'
      responses:
        '200':
          description: Dữ liệu chuỗi thời gian
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        period:
                          type: string
                          description: Tháng (YYYY-MM) hoặc quý (YYYY-Q1)
                          example: '2025-03'
                        applications:
                          type: integer
                          description: Số đơn nộp mới
                        grants:
                          type: integer
                          description: Số đơn được cấp
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
