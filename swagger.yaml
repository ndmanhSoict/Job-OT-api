openapi: 3.0.0

info:
  title: LCMS-API – Hệ thống CSDL SHTT Bắc Ninh
  version: 1.0.0
  description: |
    ## Mô tả
    REST API cho hệ thống quản lý tài sản **Sở hữu Trí tuệ tỉnh Bắc Ninh**.

    Quản lý 6 nhóm đối tượng SHTT:
    - **copyright** – Bản quyền tác giả
    - **gi** – Chỉ dẫn địa lý
    - **trademark** – Nhãn hiệu
    - **patent** – Sáng chế / Giải pháp hữu ích
    - **design** – Kiểu dáng công nghiệp
    - **craft** – Làng nghề (đặc thù Bắc Ninh)

    ## Phân quyền
    | Role | Mô tả |
    |------|-------|
    | Guest | Không cần đăng nhập – chỉ đọc (public endpoints) |
    | Staff | Cần Bearer JWT – Thêm, sửa (không hard-delete) |
    | Admin | Cần Bearer JWT – Toàn quyền (Quản lý User, Hard delete) |

    ## Rate Limiting
    | Loại endpoint | Giới hạn |
    |---------------|---------|
    | Guest/Public | 60 req/phút/IP |
    | Authenticated | 300 req/phút/IP |
    | Login | 10 req/15 phút/IP |
    | Export PDF | 10 req/phút/IP |
    | Public Export | 5 req/phút/IP |

  contact:
    name: LCMS Support
    email: support@bacninh.gov.vn
  license:
    name: Internal Use Only

servers:
  - url: http://localhost:3000/api/v1
    description: Local Development
  - url: https://api.shtt.bacninh.gov.vn/api/v1
    description: Production

tags:
  - name: Health
    description: Kiểm tra trạng thái hệ thống
  - name: Auth
    description: Xác thực và quản lý phiên đăng nhập
  - name: Users
    description: Quản lý tài khoản (Admin only)
  - name: Reference
    description: Dữ liệu danh mục (Tỉnh/Huyện, Status, Nice, IPC, Locarno...)
  - name: Organizations
    description: Quản lý tổ chức / doanh nghiệp
  - name: Persons
    description: Quản lý cá nhân / chủ đơn
  - name: Craft Villages
    description: Quản lý làng nghề Bắc Ninh
  - name: IP Assets
    description: Quản lý đối tượng SHTT, file đính kèm và liên kết làng nghề
  - name: Search
    description: Tìm kiếm toàn văn và gợi ý
  - name: Import/Export
    description: Nhập xuất dữ liệu (Excel/CSV)
  - name: Dashboard
    description: Thống kê và báo cáo (Staff/Admin)

# ==============================================================================
# COMPONENTS
# ==============================================================================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Nhập JWT access token (RS256, TTL 15 phút)

  # ─── Parameters ─────────────────────────────────────────────────────────────
  parameters:
    IdPath:
      in: path
      name: id
      required: true
      description: UUID của đối tượng
      schema:
        type: string
        format: uuid
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
    PageParam:
      in: query
      name: page
      description: Số trang (bắt đầu từ 1)
      schema:
        type: integer
        default: 1
        minimum: 1
    LimitParam:
      in: query
      name: limit
      description: Số bản ghi mỗi trang (tối đa 100)
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
    SearchParam:
      in: query
      name: q
      description: Từ khóa tìm kiếm
      schema:
        type: string
    DistrictParam:
      in: query
      name: district_code
      description: Mã quận/huyện
      schema:
        type: string
    ProvinceParam:
      in: query
      name: province_code
      description: Mã tỉnh/thành
      schema:
        type: string

  # ─── Schemas ────────────────────────────────────────────────────────────────
  schemas:

    # ── Enums ──────────────────────────────────────────────────────────────────
    AssetType:
      type: string
      enum: [copyright, gi, trademark, patent, design, craft]
      description: |
        - `copyright`: Bản quyền tác giả
        - `gi`: Chỉ dẫn địa lý
        - `trademark`: Nhãn hiệu
        - `patent`: Sáng chế / Giải pháp hữu ích
        - `design`: Kiểu dáng công nghiệp
        - `craft`: Làng nghề

    AssetStatus:
      type: string
      enum: [draft, pending_formal, published, pending_substantive, granted, refused, withdrawn, lapsed]
      description: |
        - `draft`: Bản nháp
        - `pending_formal`: Chờ thẩm định hình thức
        - `published`: Đã công bố
        - `pending_substantive`: Chờ thẩm định nội dung
        - `granted`: Đã cấp văn bằng
        - `refused`: Từ chối
        - `withdrawn`: Rút đơn
        - `lapsed`: Hết hiệu lực

    UserRole:
      type: string
      enum: [admin, staff]

    OrgType:
      type: string
      enum: [company, cooperative, association, state_agency, other]
      description: |
        - `company`: Doanh nghiệp
        - `cooperative`: Hợp tác xã
        - `association`: Hiệp hội
        - `state_agency`: Cơ quan nhà nước
        - `other`: Khác

    SortOrder:
      type: string
      enum: [ASC, DESC]
      default: DESC

    # ── Common ─────────────────────────────────────────────────────────────────
    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 100
        totalPages:
          type: integer
          example: 5

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object

    PaginatedResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            type: object
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: ASSET_NOT_FOUND
            message:
              type: string
              example: Không tìm thấy đối tượng SHTT
            details:
              type: object

    BaseEntityFields:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
          nullable: true
        created_by:
          type: string
          format: uuid
          nullable: true
        updated_by:
          type: string
          format: uuid
          nullable: true

    # ── Auth ───────────────────────────────────────────────────────────────────
    LoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
          maxLength: 255
          description: Username hoặc email
          example: admin
        password:
          type: string
          format: password
          minLength: 8
          example: P@ssword123

    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            access_token:
              type: string
              description: JWT access token (TTL 15 phút)
            refresh_token:
              type: string
              description: JWT refresh token (TTL 7 ngày)
            user:
              $ref: '#/components/schemas/UserProfile'

    RefreshTokenRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    TokenResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            access_token:
              type: string
            refresh_token:
              type: string

    LogoutRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
          minLength: 8
          description: Tối thiểu 8 ký tự, gồm chữ hoa, chữ thường, số và ký tự đặc biệt

    # ── Users ──────────────────────────────────────────────────────────────────
    UserProfile:
      allOf:
        - $ref: '#/components/schemas/BaseEntityFields'
        - type: object
          properties:
            username:
              type: string
              example: admin
            email:
              type: string
              format: email
              example: admin@bacninh.gov.vn
            full_name:
              type: string
              example: Nguyễn Văn A
            role:
              $ref: '#/components/schemas/UserRole'
            is_active:
              type: boolean
              example: true
            last_login_at:
              type: string
              format: date-time
              nullable: true

    CreateUserRequest:
      type: object
      required: [username, password, full_name, role]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 100
          pattern: '^[a-zA-Z0-9_]+$'
          description: Chỉ chứa chữ cái, số và dấu gạch dưới
          example: nguyen_van_a
        email:
          type: string
          format: email
          example: nva@bacninh.gov.vn
        password:
          type: string
          format: password
          minLength: 8
          description: Tối thiểu 8 ký tự, gồm chữ hoa, chữ thường, số và ký tự đặc biệt
        full_name:
          type: string
          maxLength: 255
          example: Nguyễn Văn A
        role:
          $ref: '#/components/schemas/UserRole'

    UpdateUserRequest:
      type: object
      properties:
        full_name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'
        is_active:
          type: boolean

    ResetPasswordRequest:
      type: object
      required: [new_password]
      properties:
        new_password:
          type: string
          format: password
          minLength: 8
          description: Tối thiểu 8 ký tự, gồm chữ hoa, chữ thường, số và ký tự đặc biệt

    # ── Organizations ──────────────────────────────────────────────────────────
    Organization:
      allOf:
        - $ref: '#/components/schemas/BaseEntityFields'
        - type: object
          properties:
            org_name:
              type: string
              example: Công ty TNHH Gốm sứ Bắc Ninh
            org_name_en:
              type: string
              nullable: true
            org_type:
              $ref: '#/components/schemas/OrgType'
            tax_code:
              type: string
              nullable: true
            address:
              type: string
              nullable: true
            district_code:
              type: string
              nullable: true
            province_code:
              type: string
              nullable: true
            phone:
              type: string
              nullable: true
            email:
              type: string
              format: email
              nullable: true
            website:
              type: string
              nullable: true

    CreateOrgRequest:
      type: object
      required: [org_name]
      properties:
        org_name:
          type: string
          maxLength: 500
          example: Công ty TNHH Gốm sứ Bắc Ninh
        org_name_en:
          type: string
          maxLength: 500
        org_type:
          $ref: '#/components/schemas/OrgType'
        tax_code:
          type: string
        address:
          type: string
        district_code:
          type: string
        province_code:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        website:
          type: string

    UpdateOrgRequest:
      type: object
      properties:
        org_name:
          type: string
          maxLength: 500
        org_name_en:
          type: string
        org_type:
          $ref: '#/components/schemas/OrgType'
        tax_code:
          type: string
        address:
          type: string
        district_code:
          type: string
        province_code:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        website:
          type: string

    # ── Persons ────────────────────────────────────────────────────────────────
    Person:
      allOf:
        - $ref: '#/components/schemas/BaseEntityFields'
        - type: object
          properties:
            full_name:
              type: string
              example: Trần Thị B
            full_name_en:
              type: string
              nullable: true
            nationality:
              type: string
              nullable: true
            address:
              type: string
              nullable: true
            district_code:
              type: string
              nullable: true
            province_code:
              type: string
              nullable: true

    PersonStaffView:
      allOf:
        - $ref: '#/components/schemas/Person'
        - type: object
          description: Bổ sung các trường nhạy cảm chỉ Staff/Admin thấy
          properties:
            id_number:
              type: string
              nullable: true
            phone:
              type: string
              nullable: true
            email:
              type: string
              format: email
              nullable: true

    CreatePersonRequest:
      type: object
      required: [full_name]
      properties:
        full_name:
          type: string
          maxLength: 255
          example: Trần Thị B
        full_name_en:
          type: string
        id_number:
          type: string
        nationality:
          type: string
        address:
          type: string
        district_code:
          type: string
        province_code:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email

    UpdatePersonRequest:
      type: object
      properties:
        full_name:
          type: string
        full_name_en:
          type: string
        id_number:
          type: string
        nationality:
          type: string
        address:
          type: string
        district_code:
          type: string
        province_code:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email

    # ── Craft Villages ─────────────────────────────────────────────────────────
    CraftVillage:
      allOf:
        - $ref: '#/components/schemas/BaseEntityFields'
        - type: object
          properties:
            village_name:
              type: string
              example: Làng gốm Phù Lãng
            products:
              type: array
              items:
                type: string
              example: [gốm, gốm sứ]
            address:
              type: string
              example: Xã Phù Lãng, huyện Quế Võ
            district_code:
              type: string
              example: QV
            recognition_number:
              type: string
              nullable: true
            recognition_date:
              type: string
              format: date
              nullable: true
            description:
              type: string
              nullable: true
            representative_image:
              type: string
              nullable: true
            is_active:
              type: boolean
              example: true

    CreateCraftVillageRequest:
      type: object
      required: [village_name, products, address, district_code]
      properties:
        village_name:
          type: string
          maxLength: 255
          example: Làng gốm Phù Lãng
        products:
          type: array
          items:
            type: string
          example: [gốm, gốm sứ]
        address:
          type: string
          example: Xã Phù Lãng, huyện Quế Võ
        district_code:
          type: string
          maxLength: 10
          example: QV
        recognition_number:
          type: string
        recognition_date:
          type: string
          format: date
        description:
          type: string
        representative_image:
          type: string
          description: URL ảnh đại diện

    UpdateCraftVillageRequest:
      type: object
      properties:
        village_name:
          type: string
          maxLength: 255
        products:
          type: array
          items:
            type: string
        address:
          type: string
        district_code:
          type: string
        recognition_number:
          type: string
        recognition_date:
          type: string
          format: date
        description:
          type: string
        representative_image:
          type: string

    # ── IP Assets ──────────────────────────────────────────────────────────────
    IpAsset:
      allOf:
        - $ref: '#/components/schemas/BaseEntityFields'
        - type: object
          properties:
            asset_type:
              $ref: '#/components/schemas/AssetType'
            title:
              type: string
              example: Nhãn hiệu gốm Phù Lãng
            application_number:
              type: string
              nullable: true
            application_date:
              type: string
              format: date
              nullable: true
            publication_number:
              type: string
              nullable: true
            publication_date:
              type: string
              format: date
              nullable: true
            grant_number:
              type: string
              nullable: true
            grant_date:
              type: string
              format: date
              nullable: true
            expiry_date:
              type: string
              format: date
              nullable: true
            status:
              $ref: '#/components/schemas/AssetStatus'
            applicant_org_id:
              type: string
              format: uuid
              nullable: true
            applicant_person_id:
              type: string
              format: uuid
              nullable: true
            applicant_name:
              type: string
              nullable: true
            province_code:
              type: string
              nullable: true
            district_code:
              type: string
              nullable: true
            meta:
              type: object
              nullable: true
              description: Dữ liệu mở rộng theo từng loại SHTT

    IpAssetStaffView:
      allOf:
        - $ref: '#/components/schemas/IpAsset'
        - type: object
          description: Bổ sung trường chỉ Staff/Admin thấy
          properties:
            internal_notes:
              type: string
              nullable: true

    CreateIpAssetRequest:
      type: object
      required: [asset_type, title]
      properties:
        asset_type:
          $ref: '#/components/schemas/AssetType'
        title:
          type: string
          maxLength: 500
          example: Nhãn hiệu gốm Phù Lãng
        application_number:
          type: string
        application_date:
          type: string
          format: date
        publication_number:
          type: string
        publication_date:
          type: string
          format: date
        grant_number:
          type: string
        grant_date:
          type: string
          format: date
        expiry_date:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/AssetStatus'
        applicant_org_id:
          type: string
          format: uuid
        applicant_person_id:
          type: string
          format: uuid
        applicant_name:
          type: string
        province_code:
          type: string
        district_code:
          type: string
        internal_notes:
          type: string
        meta:
          type: object
          description: Dữ liệu mở rộng (nice_classes, ipc_codes, locarno_codes, v.v.)

    UpdateIpAssetRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 500
        application_number:
          type: string
        application_date:
          type: string
          format: date
        publication_number:
          type: string
        publication_date:
          type: string
          format: date
        grant_number:
          type: string
        grant_date:
          type: string
          format: date
        expiry_date:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/AssetStatus'
        applicant_org_id:
          type: string
          format: uuid
        applicant_person_id:
          type: string
          format: uuid
        applicant_name:
          type: string
        province_code:
          type: string
        district_code:
          type: string
        internal_notes:
          type: string
        meta:
          type: object

    AssetImage:
      type: object
      properties:
        id:
          type: string
          format: uuid
        asset_id:
          type: string
          format: uuid
        image_url:
          type: string
        original_filename:
          type: string
        mime_type:
          type: string
        file_size:
          type: integer
        view_angle:
          type: string
          enum: [logo, main, front, back, top, bottom, side_left, side_right, perspective, cross_section, detail, other]
          nullable: true
        sort_order:
          type: integer
        is_primary:
          type: boolean
        created_at:
          type: string
          format: date-time
        uploaded_by:
          type: string
          format: uuid
          nullable: true

    AssetDocument:
      type: object
      properties:
        id:
          type: string
          format: uuid
        asset_id:
          type: string
          format: uuid
        doc_url:
          type: string
        doc_type:
          type: string
          enum: [description, claim, work_sample, certificate, other]
        original_filename:
          type: string
        mime_type:
          type: string
        file_size:
          type: integer
        created_at:
          type: string
          format: date-time
        uploaded_by:
          type: string
          format: uuid
          nullable: true

    AssetCraftVillageLink:
      type: object
      properties:
        id:
          type: string
          format: uuid
        asset_id:
          type: string
          format: uuid
        village_id:
          type: string
          format: uuid
        relation_note:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

  # ─── Responses ───────────────────────────────────────────────────────────────
  responses:
    204NoContent:
      description: Thành công, không có dữ liệu trả về

    400BadRequest:
      description: Dữ liệu đầu vào không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: VALIDATION_ERROR
              message: Dữ liệu không hợp lệ
              details: {}

    401Unauthorized:
      description: Chưa xác thực (Token hết hạn / Không hợp lệ)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: UNAUTHORIZED
              message: Token không hợp lệ hoặc đã hết hạn

    403Forbidden:
      description: Không đủ quyền truy cập
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: FORBIDDEN
              message: Không đủ quyền truy cập

    404NotFound:
      description: Không tìm thấy dữ liệu
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: NOT_FOUND
              message: Không tìm thấy dữ liệu

    429TooManyRequests:
      description: Vượt quá giới hạn request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: RATE_LIMIT_EXCEEDED
              message: Vượt quá giới hạn request

# ==============================================================================
# PATHS
# ==============================================================================
paths:

  # ============================================================================
  # HEALTH CHECK
  # ============================================================================
  /health:
    get:
      tags: [Health]
      summary: Kiểm tra trạng thái hệ thống
      operationId: healthCheck
      responses:
        '200':
