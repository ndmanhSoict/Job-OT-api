    post:
      tags: [Import/Export]
      summary: Import đối tượng SHTT từ file Excel (Staff+)
      operationId: importAssets
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, asset_type]
              properties:
                file:
                  type: string
                  format: binary
                  description: File Excel (.xlsx)
                asset_type:
                  $ref: '#/components/schemas/AssetType'
                on_duplicate:
                  type: string
                  enum: [skip, update]
                  default: skip
                  description: Hành động khi trùng application_number
      responses:
        '200':
          description: Kết quả import
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      imported:
                        type: integer
                        description: Số bản ghi đã import thành công
                        example: 45
                      skipped:
                        type: integer
                        description: Số bản ghi bỏ qua (trùng lặp)
                        example: 3
                      errors:
                        type: array
                        description: Danh sách dòng lỗi
                        items:
                          type: object
                          properties:
                            row:
                              type: integer
                            message:
                              type: string
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
